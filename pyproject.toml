[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x"
version = "0.2.0"
description = "AI-assisted digital forensics & incident investigation CLI (defensive, read-only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "THEEVVEN" }]
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sentinel-x = "sentinel_x.cli.main:main"

[tool.setuptools.packages.find]
include = ["sentinel_x*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
